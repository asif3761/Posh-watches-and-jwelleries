<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noir &amp; Aurum — Timepieces &amp; Fragrances</title>
<meta name="description" content="Noir & Aurum — dark luxury watches and fragrances, crafted for the hours you keep.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="chrono-ring" aria-hidden="true">
  <svg viewBox="0 0 64 64">
    <defs>
      <linearGradient id="chronoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8a1f2e"/>
        <stop offset="100%" stop-color="#f0d488"/>
      </linearGradient>
    </defs>
    <circle class="chrono-track" cx="32" cy="32" r="28"/>
    <circle class="chrono-fill" cx="32" cy="32" r="28"/>
  </svg>
</div>

<canvas id="scene-bg" aria-hidden="true"></canvas>
<div id="page-transition" aria-hidden="true"></div>
<div id="toast-root" aria-live="polite"></div>

<header class="site-header">
  <a href="#/" data-route="/" class="wordmark">N&amp;A</a>
  <nav class="main-nav">
    <a href="#/timepieces" data-route="/timepieces">Timepieces</a>
    <a href="#/fragrances" data-route="/fragrances">Fragrances</a>
    <a href="#/atelier" data-route="/atelier">Atelier</a>
    <a href="#/contact" data-route="/contact">Contact</a>
  </nav>
  <div class="header-actions">
    <a href="#/cart" data-route="/cart" class="cart-link" aria-label="View cart">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h2l2.2 11.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
      <span id="cart-count" class="cart-count">0</span>
    </a>
    <button id="sound-toggle" class="sound-toggle" aria-pressed="false" aria-label="Toggle sound">
      <span class="sound-icon">◔</span>
    </button>
  </div>
</header>

<main id="app"></main>

<footer class="site-footer">
  <span>&copy; <span id="year"></span> Noir &amp; Aurum</span>
  <span class="footer-note">Checkout via bKash &middot; confirmed on WhatsApp</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="data.js"></script>
<script src="audio.js"></script>
<script src="cart.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
